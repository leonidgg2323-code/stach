name: Stach core checks
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test portable core
        run: sh tools/test_core.sh
      - name: Verify embedded panel and JavaScript
        run: python3 tools/check_panel.py
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build network prototype and Waveshare BLE HID firmware
        run: pio run -e stach-network-prototype -e stach-waveshare-sh8601 -e stach-waveshare-co5300
