name: Stach core checks
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test portable core
        run: sh tools/test_core.sh
      - name: Verify embedded panel and JavaScript
        run: python3 tools/check_panel.py
      - name: Verify HTTP security guard coverage
        run: python3 tools/security_integration_check.py
      - name: Test BLE compatibility adapter
        run: python3 tools/test_ble_patch.py
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Install dependencies, patch Arduino 3 BLE API and compile all profiles
        run: python3 tools/build_firmware.py
