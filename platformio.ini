[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1

[env:stach-network-prototype]

[env:stach-waveshare-sh8601]
board_build.arduino.memory_type = qio_opi
build_flags = ${env.build_flags} -DBOARD_HAS_PSRAM -DSTACH_WAVESHARE_BOARD
lib_deps =
    moononournation/GFX Library for Arduino@^1.5.0
    ricmoo/QRCode@^0.0.1
    t-vk/ESP32 BLE Mouse@0.3.1

[env:stach-waveshare-co5300]
board_build.arduino.memory_type = qio_opi
build_flags = ${env.build_flags} -DBOARD_HAS_PSRAM -DSTACH_WAVESHARE_BOARD -DSTACH_PANEL_CO5300
lib_deps =
    moononournation/GFX Library for Arduino@^1.5.0
    ricmoo/QRCode@^0.0.1
    t-vk/ESP32 BLE Mouse@0.3.1
