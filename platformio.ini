[env]
platform = espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_mode = qio
board_build.partitions = default_16MB.csv
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1

[env:stach-network-prototype]

[env:stach-waveshare-sh8601]
; Waveshare 1.43 / 1.43B: 16MB Flash, 8MB octal PSRAM (not 1.43C).
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
build_flags = ${env.build_flags} -DBOARD_HAS_PSRAM -DSTACH_WAVESHARE_BOARD
lib_deps =
    moononournation/GFX Library for Arduino@1.6.9
    ricmoo/QRCode@^0.0.1
    t-vk/ESP32 BLE Mouse@0.3.1

[env:stach-waveshare-co5300]
; For compatible 16MB Waveshare 1.43 panel revisions only; NOT 1.43C.
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
build_flags = ${env.build_flags} -DBOARD_HAS_PSRAM -DSTACH_WAVESHARE_BOARD -DSTACH_PANEL_CO5300
lib_deps =
    moononournation/GFX Library for Arduino@1.6.9
    ricmoo/QRCode@^0.0.1
    t-vk/ESP32 BLE Mouse@0.3.1
