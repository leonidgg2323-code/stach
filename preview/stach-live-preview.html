<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stach — живой предпросмотр</title>
<style>
*{box-sizing:border-box}body{background:#11131b;color:#f2f3f7;font:16px system-ui,sans-serif;min-height:100vh;margin:0;padding:24px;display:grid;place-items:center}
main{width:min(800px,100%);text-align:center}h1{margin:0 0 5px;font-size:29px}p{color:#9298a8;margin:0 0 20px}
.watch{width:min(92vw,490px);aspect-ratio:1;margin:0 auto 22px;border-radius:50%;padding:10px;background:linear-gradient(115deg,#5a5d68 0%,#f0f0f0 22%,#8f929f 47%,#fdfdfd 66%,#555967 100%);box-shadow:0 12px 40px #0008}
.screen{width:100%;height:100%;background:#000;border-radius:50%;overflow:hidden}canvas{display:block;width:100%;height:100%;border-radius:50%}
.controls{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}button{border:1px solid #505764;background:#242934;color:#fff;border-radius:10px;padding:12px 16px;font:inherit;cursor:pointer}button:hover{background:#333c4c}button:focus-visible{outline:2px solid white}
.info{margin-top:14px;color:#aeb4c5;font-size:14px}
</style></head><body><main><h1>Stach — Smart Eyes</h1><p>Живой предпросмотр · без подключения устройства</p>
<div class="watch"><div class="screen"><canvas id="face" aria-label="Два глаза Stach"></canvas></div></div>
<div class="controls"><button data-mode="neutral">Обычный</button><button data-mode="angry">Падение → злой</button><button data-mode="sleepy">Низкий заряд → сонный</button><button data-mode="happy">Зарядка → радостный</button><button data-mode="curious">Касание → любопытный</button></div>
<div class="info" id="label">Взгляд вперёд → подготовка → влево → вправо</div>
<script>
const canvas=document.getElementById('face'),ctx=canvas.getContext('2d');
let mode='neutral',start=performance.now(),changeAt=start;const label=document.getElementById('label');
for(const btn of document.querySelectorAll('button'))btn.addEventListener('click',()=>{mode=btn.dataset.mode;changeAt=performance.now();label.textContent=({neutral:'Обычный: бровей нет',angry:'Демо падения: злость',sleepy:'Демо низкого заряда: сонливость',happy:'Демо зарядки: радость и индикатор',curious:'Демо касания: любопытство'})[mode]});
function ease(t){t=Math.max(0,Math.min(1,t));return t*t*(3-2*t)}
function between(v,a,b){return ease((v-a)/(b-a))}
function motion(sec){const t=sec%8;let look=0,prep=0;
if(t>=1.5&&t<1.74)prep=between(t,1.5,1.74);
else if(t>=1.74&&t<2.20)look=-between(t,1.74,2.20);
else if(t>=2.2&&t<3.2)look=-1;
else if(t>=3.2&&t<3.7)look=-(1-between(t,3.2,3.7));
else if(t>=4.5&&t<4.74)prep=-between(t,4.5,4.74);
else if(t>=4.74&&t<5.2)look=between(t,4.74,5.2);
else if(t>=5.2&&t<6.2)look=1;
else if(t>=6.2&&t<6.7)look=1-between(t,6.2,6.7);
return{look,prep}}
function oval(cx,cy,rx,ry,fill){ctx.beginPath();ctx.ellipse(cx,cy,Math.max(.1,rx),Math.max(.1,ry),0,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill()}
function render(now){
const dpr=Math.min(2,window.devicePixelRatio||1),size=canvas.clientWidth;
if(canvas.width!==Math.round(size*dpr)||canvas.height!==Math.round(size*dpr)){canvas.width=Math.round(size*dpr);canvas.height=Math.round(size*dpr)}
ctx.setTransform(canvas.width/466,0,0,canvas.height/466,0,0);ctx.clearRect(0,0,466,466);ctx.fillStyle='#000';ctx.fillRect(0,0,466,466);
const sec=(now-start)/1000,{look,prep}=motion(sec),open=mode==='sleepy'?.43:mode==='angry'?.75:mode==='happy'?.72:1;
const blinkPhase=Math.abs(sec%8-6.92),blink=blinkPhase<.095?Math.max(.12,blinkPhase/.095):1;
for(let i=0;i<2;i++){
const factor=(i===0?1+.17*look:1-.17*look),cx=(i===0?163:303)+47*look+4*prep,cy=229+3*Math.abs(look),rx=55*factor,ry=73*factor*open*blink;
oval(cx,cy,rx,ry,'#fff');if(ry>10)oval(cx+look*15,cy,23*factor,Math.min(ry*.72,39*factor),'#000');
if(mode!=='neutral'){
 let lift=mode==='angry'?-9:mode==='sleepy'?-5:mode==='happy'?10:8;
 let tilt=mode==='angry'?(i===0?14:-14):0;
 let asym=mode==='curious'?(i===0?8:-8):0;
 const by=cy-ry-29-lift+asym;
 ctx.beginPath();ctx.moveTo(cx-37*factor,by-tilt);ctx.lineTo(cx,by+(mode==='happy'?-8:0));ctx.lineTo(cx+37*factor,by+tilt);
 ctx.strokeStyle='#fff';ctx.lineCap='round';ctx.lineWidth=mode==='sleepy'?3:5;ctx.stroke();
}
}
if(mode==='happy'){
 const progress=(sec%1.9)/1.9;ctx.strokeStyle='#15dd76';ctx.lineWidth=3;ctx.lineCap='round';ctx.beginPath();ctx.arc(233,233,199,-1.7+progress*6.28,-1.0+progress*6.28);ctx.stroke();
 ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.strokeRect(210,35,45,18);ctx.fillStyle='#15dd76';ctx.fillRect(213,38,Math.round(39*(.32+.62*progress)),12);
 ctx.fillStyle='#fff';ctx.fillRect(256,41,3,6);
}
requestAnimationFrame(render)}requestAnimationFrame(render);
</script></main></body></html>
