<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STACH — QR preview</title>
<style>html{background:#0b0d13;color:#fff;font-family:system-ui}body{max-width:720px;margin:0 auto;padding:24px;text-align:center}h1{font-size:25px;margin:6px 0 8px}p{color:#bbb}.unit{max-width:466px;width:90vw;aspect-ratio:1;border-radius:50%;background:#000;border:9px solid #aaa;box-shadow:0 8px 48px #000;overflow:hidden;margin:22px auto}.unit img{width:100%;height:100%}button{font:inherit;background:#262a37;border:1px solid #777;border-radius:12px;color:#fff;padding:12px;margin:5px;cursor:pointer}button:focus{outline:2px solid #aaf}#note{max-width:510px;margin:15px auto;font-size:14px}</style><h1>STACH · Этап 6</h1><p>Предпросмотр QR-подключения к телефону</p><div class="unit"><img id="qr" src="qr-wifi-example.png" alt="Пример Wi-Fi QR"></div>
<div><button onclick="show('wifi')">1 · QR Wi-Fi</button><button onclick="show('portal')">2 · QR веб-панели</button></div><p id="note">Это демонстрационные имя сети и пароль — не данные твоего Stach. На устройстве будет собственный сохранённый пароль.</p><script>const img=document.getElementById('qr');function show(x){img.src=x==='wifi'?'qr-wifi-example.png':'qr-portal-example.png';img.alt=x==='wifi'?'QR подключения к Wi-Fi':'QR адреса веб-панели';}</script></html>
